<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クレーンゲーム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1 class="title">クレーンゲーム</h1>
    <canvas id="game" width="480" height="640" aria-label="クレーンゲームの画面"></canvas>
    <div class="controls">
      <button type="button" data-key="ArrowLeft" aria-label="左へ移動">←</button>
      <button type="button" data-key="Space" class="drop">下ろす</button>
      <button type="button" data-key="ArrowRight" aria-label="右へ移動">→</button>
    </div>
    <p class="help">キーボード：← → で移動、スペースで下ろす、R でリセット、M で効果音の切り替え</p>
  </main>

  <!-- ES モジュールを使わず、読み込み順で依存関係を解決する -->
  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/input.js"></script>
  <script src="js/prize.js"></script>
  <script src="js/claw.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
