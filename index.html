<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クレーンゲーム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1 class="title">クレーンゲーム</h1>

    <div class="screen">
      <canvas id="game" width="480" height="640" aria-label="クレーンゲームの画面"></canvas>

      <!-- メニュー画面。キャンバスの上に重ねて表示する -->
      <div id="menu" class="menu">
        <p class="menu-title">あそびかたを えらんでね</p>
        <!-- 左の列が かんたん（揺れなし）、右の列が むずかしい（揺れあり）。行ごとに同じ遊び方 -->
        <div class="menu-grid">
          <p class="menu-level easy">かんたん<small>揺れなし</small></p>
          <p class="menu-level hard">むずかしい<small>揺れあり</small></p>
          <button type="button" class="menu-item easy" data-mode="classic" data-level="easy">
            <span class="menu-name">1. クラシック</span>
            <span class="menu-desc">← → で動かして、スペースで下ろす</span>
            <span class="menu-score">ハイスコア：<span data-score-for="classic" data-score-level="easy">0</span></span>
          </button>
          <button type="button" class="menu-item hard" data-mode="classic" data-level="hard">
            <span class="menu-name">4. クラシック</span>
            <span class="menu-desc">← → で動かして、スペースで下ろす</span>
            <span class="menu-score">ハイスコア：<span data-score-for="classic" data-score-level="hard">0</span></span>
          </button>
          <button type="button" class="menu-item easy" data-mode="button" data-level="easy">
            <span class="menu-name">2. 2ボタン</span>
            <span class="menu-desc">① で右へ、② で奥へ。離すと下りる</span>
            <span class="menu-score">ハイスコア：<span data-score-for="button" data-score-level="easy">0</span></span>
          </button>
          <button type="button" class="menu-item hard" data-mode="button" data-level="hard">
            <span class="menu-name">5. 2ボタン</span>
            <span class="menu-desc">① で右へ、② で奥へ。離すと下りる</span>
            <span class="menu-score">ハイスコア：<span data-score-for="button" data-score-level="hard">0</span></span>
          </button>
          <button type="button" class="menu-item easy" data-mode="three" data-level="easy">
            <span class="menu-name">3. 3本爪</span>
            <span class="menu-desc">十字キーで自由に動かす。大きな景品が3つ</span>
            <span class="menu-score">ハイスコア：<span data-score-for="three" data-score-level="easy">0</span></span>
          </button>
          <button type="button" class="menu-item hard" data-mode="three" data-level="hard">
            <span class="menu-name">6. 3本爪</span>
            <span class="menu-desc">十字キーで自由に動かす。大きな景品が3つ</span>
            <span class="menu-score">ハイスコア：<span data-score-for="three" data-score-level="hard">0</span></span>
          </button>
        </div>
        <p class="menu-hint">クリックか、矢印キーで選んで Enter（1〜6 キーでも始まる）</p>
      </div>
    </div>

    <!-- クラシックモードの操作ボタン -->
    <div id="controls-classic" class="controls" hidden>
      <button type="button" data-key="ArrowLeft" aria-label="左へ移動">←</button>
      <button type="button" data-key="Space" class="drop">下ろす</button>
      <button type="button" data-key="ArrowRight" aria-label="右へ移動">→</button>
    </div>

    <!-- 2 ボタンモードの操作ボタン -->
    <div id="controls-button" class="controls" hidden>
      <button type="button" data-key="ArrowRight" class="big" aria-label="ボタン1：右へ移動">①<br>→</button>
      <button type="button" data-key="ArrowUp" class="big" aria-label="ボタン2：奥へ移動">②<br>↑</button>
    </div>

    <!-- 3 本爪モードの操作ボタン（十字キーと下ろすボタン） -->
    <div id="controls-three" class="controls three" hidden>
      <div class="dpad">
        <button type="button" data-key="ArrowUp" class="up" aria-label="奥へ移動">↑</button>
        <button type="button" data-key="ArrowLeft" class="left" aria-label="左へ移動">←</button>
        <button type="button" data-key="ArrowRight" class="right" aria-label="右へ移動">→</button>
        <button type="button" data-key="ArrowDown" class="down" aria-label="手前へ移動">↓</button>
      </div>
      <button type="button" data-key="Space" class="drop">下ろす</button>
    </div>

    <button type="button" id="back-to-menu" class="back" hidden>メニューへ（Esc）</button>

    <section class="zukan" aria-label="獲得一覧">
      <h2>けいひん ずかん <span id="zukan-progress"></span></h2>
      <ul id="zukan-list" class="zukan-list"></ul>
    </section>
    <p id="help-classic" class="help" hidden>キーボード：← → で移動、スペースで下ろす、R でリセット、M で効果音の切り替え</p>
    <p id="help-three" class="help" hidden>キーボード：← → で左右、↑ で奥、↓ で手前、スペースで下ろす。1 回 15 秒で自動で下りる。R でリセット、M で効果音の切り替え</p>
    <p id="help-button" class="help" hidden>キーボード：→（または 1）が ①、↑（または 2）が ②。R でリセット、M で効果音の切り替え</p>
  </main>

  <!-- ES モジュールを使わず、読み込み順で依存関係を解決する -->
  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/input.js"></script>
  <script src="js/prize.js"></script>
  <script src="js/swing.js"></script>
  <script src="js/claw.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/render.js"></script>
  <script src="js/render_floor.js"></script>
  <script src="js/session.js"></script>
  <script src="js/modes/classic.js"></script>
  <script src="js/modes/floor.js"></script>
  <script src="js/modes/button.js"></script>
  <script src="js/modes/three_claw.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
